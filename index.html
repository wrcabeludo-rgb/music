<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Музыкальные приложения</title>
<style>
:root{--bg:#16130f;--card:#211d18;--text:#f3ede4;--muted:#a89f92;--line:#3a332b;--acc:#f2a33a}
@media (prefers-color-scheme:light){:root{--bg:#f6f1ea;--card:#fffdf9;--text:#231c14;--muted:#6f6455;--line:#e2d8ca;--acc:#c46f05}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px}
a.app{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--text);text-decoration:none;margin:12px 0}
a.app img{width:56px;height:56px;border-radius:12px}
a.app b{display:block}a.app small{color:var(--muted)}
</style>
</head>
<body><main>
<h1>Музыкальные приложения</h1>
<a class="app" href="guitar-impro/"><img src="guitar-impro/icons/icon-192.png" alt=""><span><b>Гитара: аккорды и импровизация</b><small>Аппликатуры, фразы, теория и упражнения «повтори за мной»</small></span></a>
</main></body>
</html>
